<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costa Rica Unidos — Plataforma Territorial Soberana</title>
    <meta name="description" content="Plataforma ciudadana soberana para la gestión territorial, trámites y participación cívica en la República de Costa Rica." />
    <!-- Favicon Oficial con Rompedor de Caché -->
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="/logo.png?v=2" />
    <link rel="apple-touch-icon" href="/logo.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              obsidian: '#00040D',
              'sovereign-blue': '#002B7F',
              'institutional-blue': '#001489',
              'solidarity-red': '#CE1126',
              'national-red': '#DA291C',
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Filtros SVG Estándar para Adaptación de Daltonismo (WCAG 2.1 AA / Ley N° 7600) -->
    <svg id="daltonismo-svg-filters" aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;">
      <defs>
        <!-- Protanopía -->
        <filter id="protanopia">
          <feColorMatrix type="matrix" values="0.567, 0.433, 0,     0, 0
                                               0.558, 0.442, 0,     0, 0
                                               0,     0.242, 0.758, 0, 0
                                               0,     0,     0,     1, 0" />
        </filter>
        <!-- Deuteranopía -->
        <filter id="deuteranopia">
          <feColorMatrix type="matrix" values="0.625, 0.375, 0,   0, 0
                                               0.7,   0.3,   0,   0, 0
                                               0,     0.3,   0.7, 0, 0
                                               0,     0,     0,   1, 0" />
        </filter>
        <!-- Tritanopía -->
        <filter id="tritanopia">
          <feColorMatrix type="matrix" values="0.95, 0.05,  0,     0, 0
                                               0,    0.433, 0.567, 0, 0
                                               0,    0.475, 0.525, 0, 0
                                               0,    0,     0,     1, 0" />
        </filter>
        <!-- Acromatopsia -->
        <filter id="achromatopsia">
          <feColorMatrix type="matrix" values="0.299, 0.587, 0.114, 0, 0
                                               0.299, 0.587, 0.114, 0, 0
                                               0.299, 0.587, 0.114, 0, 0
                                               0,     0,     0,     1, 0" />
        </filter>
      </defs>
    </svg>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
